<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Kronos Download Manager</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/themes.css" />
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body class="main">
    <header class="titlebar">
      <img class="tb-icon" src="assets/icons/logo.svg" alt="" />
      <span class="tb-title">Kronos Download Manager</span>
    </header>

    <div class="page" id="page">
      <aside class="sidebar">
        <button class="btn-add" id="addLink" title="Add a new download (Ctrl+N)">
          <img src="assets/icons/add.svg" alt="" />
          <span>Add Link</span>
        </button>
        <nav class="nav" id="nav">
          <button class="nav-item active" data-view="all">
            <img src="assets/icons/nav-all.svg" alt="" class="only-light" /><img src="assets/icons/nav-all.svg" alt="" class="only-dark" />
            <span>All Downloads</span><b class="badge" id="badgeAll"></b>
          </button>
          <button class="nav-item" data-view="completed">
            <img src="assets/icons/nav-completed.svg" alt="" class="only-light" /><img src="assets/icons/nav-completed-dark.svg" alt="" class="only-dark" />
            <span>Completed</span>
          </button>
          <button class="nav-item" data-view="scheduled">
            <img src="assets/icons/nav-scheduled.svg" alt="" class="only-light" /><img src="assets/icons/nav-scheduled-dark.svg" alt="" class="only-dark" />
            <span>Scheduled</span><b class="badge" id="badgeQueue"></b>
          </button>
          <button class="nav-item" data-view="settings">
            <img src="assets/icons/nav-settings.svg" alt="" class="only-light" /><img src="assets/icons/nav-settings-dark.svg" alt="" class="only-dark" />
            <span>Settings</span>
          </button>
        </nav>
        <div class="side-foot">
          <div class="total-speed" id="totalSpeed" hidden></div>
          <div class="foot-row">
            <button class="gh" id="github" title="Project on GitHub">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
            </button>
            <div class="version" id="version">Version 0.1</div>
          </div>
        </div>
      </aside>

      <section class="content">
        <div class="toolbar">
          <div class="tool-box search" id="search">
            <span class="search-icon"><img src="assets/icons/search.svg" alt="" /></span>
            <input id="searchInput" type="text" placeholder="Search..." spellcheck="false" />
            <button class="search-clear" id="searchClear" title="Clear"><img src="assets/icons/search-clear.svg" alt="" /></button>
          </div>
          <div class="tool-box actions" id="actions">
            <button class="tool-btn resume" id="actResume" data-tip="Resume" disabled>
              <svg viewBox="0 0 24 24" fill="none"><path d="M7.25 5.9v12.2c0 1 1.1 1.6 1.93 1.05l9.15-6.1a1.25 1.25 0 0 0 0-2.1L9.18 4.85C8.35 4.3 7.25 4.9 7.25 5.9Z" fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
            </button>
            <button class="tool-btn pause" id="actPause" data-tip="Pause" disabled>
              <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.75" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-width="1.5"/><path d="M10 9.25v5.5M14 9.25v5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <button class="tool-btn stop" id="actStop" data-tip="Stop all downloads" disabled>
              <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.75" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-width="1.5"/><rect x="9.25" y="9.25" width="5.5" height="5.5" rx="1.2" stroke="currentColor" stroke-width="1.5"/></svg>
            </button>
            <button class="tool-btn delete" id="actDelete" data-tip="Delete" disabled>
              <svg viewBox="0 0 24 24" fill="none"><path d="M6.6 7.5l.75 10.6a2 2 0 0 0 2 1.9h5.3a2 2 0 0 0 2-1.9l.75-10.6" fill="currentColor" fill-opacity=".2"/><path d="M4.75 7.5h14.5M9.5 7.25V5.6c0-.75.6-1.35 1.35-1.35h2.3c.75 0 1.35.6 1.35 1.35v1.65M6.6 7.5l.75 10.6a2 2 0 0 0 2 1.9h5.3a2 2 0 0 0 2-1.9l.75-10.6M10.25 10.75v5.5M13.75 10.75v5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="tool-box view-switch" id="viewSwitch">
            <button class="tool-btn on" data-view-mode="cards" data-tip="Large icons">
              <svg viewBox="0 0 24 24" fill="none"><rect x="4.25" y="4.75" width="15.5" height="14.5" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M4.25 9.6h15.5M4.25 14.4h15.5" stroke="currentColor" stroke-width="1.6"/></svg>
            </button>
            <button class="tool-btn" data-view-mode="compact" data-tip="Compact list">
              <svg viewBox="0 0 24 24" fill="none"><circle cx="5.5" cy="7" r="1.15" fill="currentColor"/><circle cx="5.5" cy="12" r="1.15" fill="currentColor"/><circle cx="5.5" cy="17" r="1.15" fill="currentColor"/><path d="M9.5 7h10M9.5 12h10M9.5 17h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>

        <div class="card" id="card">
          <!-- All / Completed -->
          <div class="view" id="view-list">
            <div class="list" id="list"></div>
            <div class="empty" id="empty" hidden>
              <img src="assets/icons/logo.svg" alt="" />
              <div class="empty-title" id="emptyTitle">No downloads yet</div>
              <div class="empty-sub" id="emptySub">Click “Add Link”, paste a link (Ctrl+V) or drop one here.</div>
            </div>
          </div>

          <!-- Scheduled (queue + scheduler) -->
          <div class="view" id="view-scheduled" hidden>
            <div class="queue-panel">
              <div class="qp-row">
                <button class="btn btn-primary qp-start" id="queueStart"><img src="assets/icons/btn-play.svg" alt="" class="white" /><span>Start queue</span></button>
                <button class="btn btn-outline qp-stop" id="queueStop" hidden><img src="assets/icons/btn-pause.svg" alt="" /><span>Stop queue</span></button>
                <div class="qp-status" id="queueStatus">Queue is idle</div>
              </div>
              <div class="qp-grid">
                <label class="qp-cell"><span class="switch"><input type="checkbox" id="schEnabled" /><span></span></span><span>Start at</span><input class="field time" type="time" id="schStart" /></label>
                <label class="qp-cell"><span class="switch"><input type="checkbox" id="schStopEnabled" /><span></span></span><span>Stop at</span><input class="field time" type="time" id="schStop" /></label>
                <div class="qp-cell days" id="schDays"></div>
                <label class="qp-cell"><span>At a time</span><select class="field small" id="schMax"></select></label>
                <label class="qp-cell"><span>When finished</span>
                  <select class="field" id="schAfter">
                    <option value="none">Do nothing</option>
                    <option value="exit">Exit app</option>
                    <option value="sleep">Sleep</option>
                    <option value="hibernate">Hibernate</option>
                    <option value="shutdown">Shut down</option>
                  </select>
                </label>
              </div>
            </div>
            <div class="list" id="qlist"></div>
            <div class="empty small" id="qempty" hidden>
              <div class="empty-title">The queue is empty</div>
              <div class="empty-sub">Choose “Download Later” when adding a link, or right-click a download → Add to queue.</div>
            </div>
          </div>

          <!-- Settings -->
          <div class="view settings" id="view-settings" hidden></div>

          <div class="power-banner" id="powerBanner" hidden>
            <span id="powerText"></span>
            <button class="btn btn-secondary text-only" id="powerCancel">Cancel</button>
          </div>
        </div>
      </section>
    </div>

    <div class="drop-hint" id="dropHint" hidden><div>Drop link to download</div></div>

    <script src="common.js"></script>
    <script src="views/settings.js"></script>
    <script src="main.js"></script>
  </body>
</html>
